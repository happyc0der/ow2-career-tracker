[project]
name = "owdash"
version = "1.0.0"
description = "Personal Overwatch 2 career dashboard: snapshots your public career stats and charts every hero over time."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
]

[project.scripts]
owdash = "owdash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["owdash"]
